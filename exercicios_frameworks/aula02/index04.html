<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo de IMC</title>
</head>
<body>
    <script>
        let peso = 70.0;
        let altura = 1.80;
        let imc = peso / altura ** 2;

        if (imc >= 18.5 && imc <= 24.9){
            document.write("O seu IMC é " + imc + " considerado Saudável!");
        } if (imc < 16){
            document.write("O seu IMC é " + imc + " Considerado Magreza grave!");
        } if (imc >= 16 && imc <= 16.9){
            document.write("O seu IMC é " + imc + " Considerado magreza moderada!");
        } if (imc >= 17 && imc <= 18.4){
            document.write("O seu IMC é " + imc + " Considerado magreza leve!");
        } if (imc >= 25 && imc <= 29.9){
            document.write("O seu IMC é " + imc + " Considerado sobrepeso");
        } if (imc >= 30 && imc <= 34.9){
            document.write("O seu IMC é " + imc + " Considerado obesidade grau I!");
        } if (imc >= 35 && imc <= 39.9){
            document.write("O seu IMC é " + imc + " Considerado obesidade severa!");
        } if (imc > 40) {
            document.write("O seu IMC é " + imc + " Considerado obesidade morbida!");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média de nota 6</title>
</head>
<body>

    <h1>
    <script>
        let nota_1 = 7;
        let nota_2 = 8;
        let nota_3 = 5;

        let nota_final = (nota_1 + nota_2 + nota_3) / 3;

        if (nota_final >= 6){
            document.write("Aprovado! Sua nota é: " + nota_final);  
        } else {
            document.write("Reprovado! Sua nota é: " + nota_final);
        }

    </script>    
    </h1>
    
</body>
</html>

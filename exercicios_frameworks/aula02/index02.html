<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia da semana</title>
</head>
<body>
    <h1>
            <script>

        let numero = 2

        switch(numero){
            case 1: document.writeln('Domingo'); break;
            case 2: document.writeln('Segunda'); break;
            case 3: document.writeln('Terça'); break;
            case 4: document.writeln('Quarta'); break;
            case 5: document.writeln('Quinta'); break;
            case 6: document.writeln('Sexta'); break;
            case 7: document.writeln('Sábado'); break;
            default: document.writeln("O número está fora do intervalo! "); break;
        }
    </script>
    </h1>
</body>
</html>

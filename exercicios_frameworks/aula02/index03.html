<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número ímpar ou par</title>
</head>
<body>
    <h1>
        <script>
            let numero = 2

            if (numero % 2 === 0){
                document.write("O número " + numero + " é par");
            } else {
                document.write("O número " + numero + " é ímpar");
            }
                
        </script>
    </h1>
</body>
</html>
